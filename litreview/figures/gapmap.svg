<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Figure 2 — Gap map: six literatures, one missing substrate</text>
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#555">each solves one property; none carries provenance, correction, and consent through the memory record itself</text>

  <!-- six literature boxes -->
  <g font-size="12">
    <rect x="30" y="90" width="250" height="96" rx="8" fill="#eaf1fb" stroke="#2f5fa3" stroke-width="1.5"/>
    <text x="155" y="112" text-anchor="middle" font-weight="700" fill="#1f3d63">Memory architectures</text>
    <text x="155" y="130" text-anchor="middle" fill="#333">MemGPT · Generative Agents · Zep</text>
    <text x="155" y="148" text-anchor="middle" fill="#a33">stores/retrieves, trusts content,</text>
    <text x="155" y="164" text-anchor="middle" fill="#a33">consolidation rewrites the past</text>

    <rect x="305" y="90" width="250" height="96" rx="8" fill="#eaf1fb" stroke="#2f5fa3" stroke-width="1.5"/>
    <text x="430" y="112" text-anchor="middle" font-weight="700" fill="#1f3d63">Personal memory</text>
    <text x="430" y="130" text-anchor="middle" fill="#333">MemoryBank · PerLTQA · profiles</text>
    <text x="430" y="148" text-anchor="middle" fill="#a33">stale-fact failures measured,</text>
    <text x="430" y="164" text-anchor="middle" fill="#a33">no user correction protocol</text>

    <rect x="580" y="90" width="250" height="96" rx="8" fill="#eaf1fb" stroke="#2f5fa3" stroke-width="1.5"/>
    <text x="705" y="112" text-anchor="middle" font-weight="700" fill="#1f3d63">Knowledge editing</text>
    <text x="705" y="130" text-anchor="middle" fill="#333">ROME · MEMIT · MQuAKE</text>
    <text x="705" y="148" text-anchor="middle" fill="#a33">edits weights, not records;</text>
    <text x="705" y="164" text-anchor="middle" fill="#a33">consequences do not propagate</text>

    <rect x="30" y="216" width="250" height="96" rx="8" fill="#eaf1fb" stroke="#2f5fa3" stroke-width="1.5"/>
    <text x="155" y="238" text-anchor="middle" font-weight="700" fill="#1f3d63">Unlearning &amp; consent</text>
    <text x="155" y="256" text-anchor="middle" fill="#333">SISA · Athena · data deletion</text>
    <text x="155" y="274" text-anchor="middle" fill="#a33">deletes from training data;</text>
    <text x="155" y="290" text-anchor="middle" fill="#a33">no proof of absence in prompts</text>

    <rect x="305" y="216" width="250" height="96" rx="8" fill="#eaf1fb" stroke="#2f5fa3" stroke-width="1.5"/>
    <text x="430" y="238" text-anchor="middle" font-weight="700" fill="#1f3d63">Agent provenance</text>
    <text x="430" y="256" text-anchor="middle" fill="#333">traces · MAP-Graph · transp. logs</text>
    <text x="430" y="274" text-anchor="middle" fill="#a33">audits actions, not the</text>
    <text x="430" y="290" text-anchor="middle" fill="#a33">personal memory they read</text>

    <rect x="580" y="216" width="250" height="96" rx="8" fill="#eaf1fb" stroke="#2f5fa3" stroke-width="1.5"/>
    <text x="705" y="238" text-anchor="middle" font-weight="700" fill="#1f3d63">Evaluation &amp; cost</text>
    <text x="705" y="256" text-anchor="middle" fill="#333">LongMemEval · LoCoMo · RAG-vs-LC</text>
    <text x="705" y="274" text-anchor="middle" fill="#a33">scores recall and tokens,</text>
    <text x="705" y="290" text-anchor="middle" fill="#a33">not auditability or consent</text>
  </g>

  <!-- arrows down -->
  <line x1="155" y1="312" x2="380" y2="380" stroke="#888" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="430" y1="312" x2="430" y2="380" stroke="#888" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="705" y1="312" x2="480" y2="380" stroke="#888" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- the gap -->
  <rect x="180" y="384" width="500" height="120" rx="10" fill="#2f5fa3" stroke="#1f3d63" stroke-width="2"/>
  <text x="430" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">The gap — verifiable memory (Layer 4)</text>
  <text x="430" y="436" text-anchor="middle" font-size="12" fill="#dbe6f5">sessions, preferences, history as provenance-carrying records:</text>
  <text x="430" y="456" text-anchor="middle" font-size="12" fill="#dbe6f5">append-only · versioned · queryable · user-inspectable</text>
  <text x="430" y="478" text-anchor="middle" font-size="12" fill="#ffffff">correction = bound record with transitive re-flagging · deletion = provable absence</text>

  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#888"/>
    </marker>
  </defs>
</svg>
