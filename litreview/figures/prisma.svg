  <text x="410" y="397" text-anchor="middle" font-size="13" font-weight="700" fill="#3d2a63">Citation verification</text>
  <text x="410" y="418" text-anchor="middle" font-size="12" fill="#3d2a63">OpenAlex DOI / arXiv resolver · 37/37 resolved</text>

  <line x1="410" y1="432" x2="410" y2="464" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="235" y="464" width="350" height="64" rx="8" fill="#2f5fa3" stroke="#1f3d63" stroke-width="1.8"/>
  <text x="410" y="490" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Included in synthesis: n = 37</text>
  <text x="410" y="512" text-anchor="middle" font-size="11" fill="#dbe6f5">across 6 themes · architectures · personal memory · editing · unlearning · provenance · evaluation</text>

  <defs>
