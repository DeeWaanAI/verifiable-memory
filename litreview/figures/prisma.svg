  <text x="410" y="228" text-anchor="middle" font-size="12" fill="#7a4a12">removed 80 dupes → unique n = 668</text>

  <line x1="410" y1="242" x2="410" y2="274" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="235" y="274" width="350" height="66" rx="8" fill="#eef7ee" stroke="#3f8f4f" stroke-width="1.5"/>
