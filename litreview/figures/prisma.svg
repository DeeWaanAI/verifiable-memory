  <text x="225" y="126" text-anchor="middle" font-size="12" fill="#1f3d63">records retrieved: n = 569</text>
  <text x="225" y="142" text-anchor="middle" font-size="11" fill="#555">title_and_abstract.search · 2018–2026</text>

  <rect x="430" y="80" width="330" height="70" rx="8" fill="#eaf1fb" stroke="#2f5fa3" stroke-width="1.5"/>
